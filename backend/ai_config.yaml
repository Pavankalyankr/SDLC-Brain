# =============================================================================
# SDLC Brain — AI Configuration
# This file controls which AI model handles each task type.
# It can be overridden via the AI Configuration page in the UI.
# =============================================================================

providers:
  gemini:
    name: "Gemini"
    api_key: "${GEMINI_API_KEY}"
    enabled: true

  # Future providers (uncomment to enable)
  # ollama:
  #   name: "Ollama"
  #   api_base: "http://localhost:11434"
  #   api_key: ""
  #   enabled: false
  #
  # groq:
  #   name: "Groq"
  #   api_base: "https://api.groq.com/openai/v1"
  #   api_key: "${GROQ_API_KEY}"
  #   enabled: false
  #
  # nvidia_nim:
  #   name: "NVIDIA NIM"
  #   api_base: "https://integrate.api.nvidia.com/v1/"
  #   api_key: "${NVIDIA_NIM_API_KEY}"
  #   enabled: false

models:
  gemini-flash-latest:
    display_name: "Gemini Flash Latest"
    provider: "gemini"
    model_id: "gemini-flash-latest"
    description: "Primary model for analysis, planning, and engineering tasks"
    max_tokens: 8192
    temperature: 0.7
    category: "general"

# Task-to-model routing
# The AI Orchestrator uses this to automatically select the right model
routing:
  agile: "gemini-flash-latest"
  architecture: "gemini-flash-latest"
  development: "gemini-flash-latest"
  qa: "gemini-flash-latest"
  code_review: "gemini-flash-latest"
  knowledge: "gemini-flash-latest"
  devops: "gemini-flash-latest"
  production: "gemini-flash-latest"
  project_management: "gemini-flash-latest"

# Default generation parameters (can be overridden per model)
defaults:
  max_tokens: 4096
  temperature: 0.5
  top_p: 0.95
  stream: true
