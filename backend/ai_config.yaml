# =============================================================================
# SDLC Brain — AI Configuration
# This file controls which AI model handles each task type.
# It can be overridden via the AI Configuration page in the UI.
# =============================================================================

providers:
  openrouter:
    name: "OpenRouter"
    api_base: "${OPENROUTER_API_BASE}"
    api_key: "${OPENROUTER_API_KEY}"
    enabled: true

  # Future providers (uncomment to enable)
  # ollama:
  #   name: "Ollama"
  #   api_base: "http://localhost:11434"
  #   api_key: ""
  #   enabled: false
  #
  # groq:
  #   name: "Groq"
  #   api_base: "https://api.groq.com/openai/v1"
  #   api_key: "${GROQ_API_KEY}"
  #   enabled: false
  #
  # nvidia_nim:
  #   name: "NVIDIA NIM"
  #   api_base: "https://integrate.api.nvidia.com/v1/"
  #   api_key: "${NVIDIA_NIM_API_KEY}"
  #   enabled: false

models:
  deepseek-r1:
    display_name: "DeepSeek-R1"
    provider: "openrouter"
    model_id: "openrouter/deepseek/deepseek-r1"
    description: "Primary reasoning model for analysis and planning tasks"
    max_tokens: 8192
    temperature: 0.7
    category: "reasoning"

  qwen3-coder:
    display_name: "Qwen3-Coder"
    provider: "openrouter"
    model_id: "openrouter/qwen/qwen-3-coder-instruct"
    description: "Primary engineering model for code generation and review"
    max_tokens: 8192
    temperature: 0.3
    category: "engineering"

# Task-to-model routing
# The AI Orchestrator uses this to automatically select the right model
routing:
  agile: "deepseek-r1"
  architecture: "deepseek-r1"
  development: "qwen3-coder"
  qa: "qwen3-coder"
  code_review: "qwen3-coder"
  knowledge: "qwen3-coder"
  devops: "qwen3-coder"
  production: "deepseek-r1"
  project_management: "deepseek-r1"

# Default generation parameters (can be overridden per model)
defaults:
  max_tokens: 4096
  temperature: 0.5
  top_p: 0.95
  stream: true
